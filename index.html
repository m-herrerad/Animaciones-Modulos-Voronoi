      const fg=new THREE.BufferGeometry(); fg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(b64(f.pos)),3));
      const mat=new THREE.MeshBasicMaterial({color:col.clone(),transparent:true,opacity:0,side:THREE.DoubleSide});
      const mesh=new THREE.Mesh(fg,mat), grp=new THREE.Group(); grp.add(mesh);
      const H=new THREE.Vector3(f.H[0],f.H[1],0), par=f.parent>=0?nodes[f.parent]:null;
      grp.position.copy(H).sub(par?par.H:new THREE.Vector3()); (par?par.grp:net).add(grp);
      const axis=new THREE.Vector3(f.axis[0],f.axis[1],0).normalize(), cen=new THREE.Vector3(f.cen[0],f.cen[1],0);
      const cm=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
      if(par){const cr=new THREE.Mesh(new THREE.PlaneGeometry(f.len,.05),cm); cr.rotation.z=Math.atan2(axis.y,axis.x); cr.position.z=.01; grp.add(cr);}
      const cz=axis.x*cen.y-axis.y*cen.x, sign=(cz>0?1:-1)*m.fz*f.cv;       // pliega hacia el lado del sólido
      nodes.push({grp,mat,cm,H,axis,sign,theta:f.theta,cen,idx:k,isRoot:!par});
    });
    scene.add(holder);
    return {lbl:mkLbl(),i,m,holder,content,net,tpl,tmat,solid,clip,nodes,open_:1,target:1,startAt:1+i*2.4,phase:i*2.1,speed:.42+i*.07,spin:i*2.1,sphere:new THREE.Sphere(new THREE.Vector3(),2.3)};
  });

  let vertical=false,spacing=7;
  function resize(){
    const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; vertical=camera.aspect<.85;
    const half=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
    if(vertical){spacing=6.6; camera.position.z=Math.max(16,Math.max((spacing+3.6)/half,3.6/(half*camera.aspect)));}
    else{spacing=7.2; camera.position.z=Math.max(15,(spacing+3.6)/(half*camera.aspect));}
    camera.updateProjectionMatrix();
  }
  addEventListener('resize',resize); resize();

  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), hit=new THREE.Vector3();
  let pointer=null,lastInput=-99;
  const setP=e=>{pointer={x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1};lastInput=performance.now()/1000;hint.style.opacity=0;};
  addEventListener('pointermove',setP); addEventListener('pointerdown',setP);
  document.addEventListener('pointerleave',()=>{pointer=null;});

  const tmpQ=new THREE.Quaternion(), tmpV=new THREE.Vector3(), avg=new THREE.Vector3(), nrm=new THREE.Vector3(), cs=new THREE.Vector3();
  const clock=new THREE.Clock(); let t=0;
  function frame(){
    const dt=Math.min(clock.getDelta(),.05); t+=dt;
    let hov=null,bd=1e9;
    if(pointer){ndc.set(pointer.x,pointer.y);ray.setFromCamera(ndc,camera);
      for(const p of pieces){p.sphere.center.copy(p.holder.position);p.sphere.radius=2.4+ease(p.open_)*1.4;
        if(ray.ray.intersectSphere(p.sphere,hit)){const d=hit.distanceTo(camera.position);if(d<bd){bd=d;hov=p;}}}}
    canvas.style.cursor=hov?'pointer':'default';
    const idle=(performance.now()/1000-lastInput)>3.5;
    pieces.forEach((p,i)=>{
      const introDone=t>p.startAt, auto=idle&&introDone&&t>p.startAt+ASSEMBLE_SECS+6&&((t/30+i/3)%1)<.28;
      p.target=(!introDone||hov===p||auto)?1:0;
      const diff=p.target-p.open_;
      p.open_=clamp(p.open_+Math.sign(diff)*Math.min(Math.abs(diff),dt/(p.target?OPEN_SECS:ASSEMBLE_SECS)),0,1);
      p.spin+=dt*p.speed; if(p.open_===0||p.open_===1) p.spin%=6.283185;

      const k=i-1, s=1-p.open_, wr=smooth(.12,.85,s), K=p.m.K;
      p.holder.position.set(vertical?0:k*spacing,(vertical?-k*spacing:0)+Math.sin(t*.8+p.phase)*.18,Math.sin(t*.5+p.phase)*.2);
      p.holder.rotation.set(wr*(.3+Math.sin(t*.45+p.phase)*.1),p.spin*wr,wr*Math.sin(t*.3+p.phase)*.06);
      const Kc=1+(K-1)*smooth(.08,.9,s); p.content.scale.setScalar(Kc);

      // 1) la plantilla (tu imagen) cede el paso a sus caras reales, que se pliegan una a una por sus aristas
      const swap=smooth(0,.05,s); p.tmat.opacity=1-swap; p.tpl.visible=swap<.999;
      const nf=Math.max(1,p.nodes.length-1), slot=.6/nf; let cur=0;
      for(const n of p.nodes){
        let a=0;
        if(!n.isRoot){
          const u=clamp((s-(.06+(n.idx-1)*slot))/(slot*1.1),0,1); a=ease(u); if(u>0) cur=Math.max(cur,n.idx);
          n.cm.opacity=Math.sin(Math.PI*u)*.9+(u>=1?.18:0);
        }
        n.grp.quaternion.setFromAxisAngle(n.axis,n.sign*n.theta*a);
      }
      p.net.updateMatrixWorld(true);
      avg.set(0,0,0); for(const n of p.nodes){tmpV.copy(n.cen); n.grp.localToWorld(tmpV); p.content.worldToLocal(tmpV); avg.add(tmpV);}
      avg.multiplyScalar(1/p.nodes.length);
      cs.set(p.m.cs[0],p.m.cs[1],p.m.cs[2]); avg.lerp(cs,smooth(.6,.95,s));
      p.content.position.copy(avg).multiplyScalar(-Kc*smooth(.05,.85,s));

      const netA=swap*(1-smooth(.68,.98,s));
      for(const n of p.nodes){
        n.grp.children[0].getWorldQuaternion(tmpQ); nrm.copy(Z).applyQuaternion(tmpQ);
        const sh=.45+.55*Math.abs(nrm.z); n.mat.color.set(p.m.color).multiplyScalar(sh);
        n.mat.opacity=netA; n.mat.depthWrite=netA>.98; n.grp.visible=netA>.004; n.cm.opacity*=netA;
      }
      p.lbl.textContent=s<=.001?'plantilla':s>=.999?'objeto 3d':s<.66?('pliegue '+cur+' / '+nf):'formando el sólido';
      tmpV.set(p.holder.position.x,p.holder.position.y-3.4,0).project(camera);
      p.lbl.style.left=((tmpV.x*.5+.5)*innerWidth)+'px'; p.lbl.style.top=((-tmpV.y*.5+.5)*innerHeight)+'px';

      // 2) el sólido se construye de abajo hacia arriba mientras el pliegue se disuelve
      const wp=smooth(.64,.98,s); p.solid.visible=wp>.003;
      tmpV.set(0,1,0).applyQuaternion(p.holder.quaternion);
      const yc=wp>=.999?99:-2.9+5.8*wp;
      p.clip.normal.copy(tmpV).negate(); p.clip.constant=tmpV.dot(p.holder.position)+yc;
    });
    stars.rotation.y=t*.006; stars.rotation.x=t*.003;
    renderer.render(scene,camera);
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
